name: Package variants

# homeassistant/packages_include_dir_named/ is generated from homeassistant/packages/
# by tools/make_include_dir_named.py: fail if someone edits one without the other.
on:
  push:
    paths:
      - "homeassistant/packages/**"
      - "homeassistant/packages_include_dir_named/**"
      - "tools/make_include_dir_named.py"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "homeassistant/packages/**"
      - "homeassistant/packages_include_dir_named/**"
      - "tools/make_include_dir_named.py"
      - ".github/workflows/packages.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: python3 tools/make_include_dir_named.py --check
