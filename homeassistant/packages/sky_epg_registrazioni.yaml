# =============================================================================
# Sky Q TV Guide for Home Assistant - recordings (optional)
# https://github.com/amedeorutigliano/ha-sky-q-tv-guide
#
# DO NOT EDIT THIS FILE. Mark the decoder with the hard disk with
# "registrazioni: true" in sky_epg_decoders.yaml: recordings are booked on that
# decoder (Sky Q Mini boxes play the recordings from there). Without such a
# decoder this package stays idle and the card hides the recording features.
#
# Uses the local REST API of the Sky Q main box (port 9006), the same API used
# by the Sky Q integration (pyskyqremote library):
#   GET  pvr/?limit=1000&offset=0                 list of the recordings
#   GET  pvr/storage                              disk usage
#   POST pvr/action/bookrecording?eid=<eid>       record a programme
#   POST pvr/action/bookseriesrecording?eid=<eid> record the whole series
#   POST pvr/action/delete?pvrid=<pvrid>          cancel / delete a recording
#   POST pvr/action/seriesunlink?pvrid=<pvrid>    stop recording the series
#
# - sensor.sky_q_registrazioni: scheduled and in-progress recordings
#   (attribute "programmate") and disk usage (attribute "disco_occupato", %).
# - script.sky_q_registrazione: records a programme or a whole series, cancels
#   a recording or a series (used by the card: long-press a programme).
# Shared logic in the macros of custom_templates/sky_epg.jinja.
# =============================================================================
sky_epg_registrazioni:
  rest_command:
    # Read: percorso e.g. "pvr/?limit=1000&offset=0" or "pvr/storage"
    sky_epg_decoder_leggi:
      url: "http://{{ host }}:9006/as/{{ percorso }}"
      method: get
      timeout: 30

    # Recording actions (HTTP 200 = ok), percorso e.g.
    # "pvr/action/bookrecording?eid=E300-5e" or "pvr/action/delete?pvrid=P123"
    sky_epg_decoder_azione:
      url: "http://{{ host }}:9006/as/{{ percorso }}"
      method: post
      timeout: 30

  recorder:
    exclude:
      entities:
        - sensor.sky_q_registrazioni

  script:
    sky_q_registrazione:
      alias: Sky Q - Registrazione
      description: >-
        Records a programme or a whole series from the Sky TV guide, or cancels a
        scheduled recording or a series, on the Sky Q decoder with the hard disk.
      icon: mdi:record-rec
      mode: queued
      max: 10
      fields:
        azione:
          name: Azione
          description: Action
          required: true
          selector:
            select:
              options:
                - label: Registra il programma (record the programme)
                  value: registra
                - label: Registra la serie (record the series)
                  value: registra_serie
                - label: Annulla la registrazione (cancel the recording)
                  value: annulla
                - label: Annulla la serie (cancel the series)
                  value: annulla_serie
        eid:
          name: Evento
          description: Sky event id of the programme (for registra / registra_serie)
          example: E300-5e
          selector:
            text:
              multiline: false
        pvrid:
          name: Registrazione
          description: Id of the recording (for annulla / annulla_serie)
          example: P29038072
          selector:
            text:
              multiline: false
      sequence:
        - variables:
            host: "{{ state_attr('sensor.sky_q_registrazioni', 'host') or '' }}"
            id_evento: "{{ eid | default('') | string | trim }}"
            id_reg: "{{ pvrid | default('') | string | trim }}"
            programmate: "{{ state_attr('sensor.sky_q_registrazioni', 'programmate') or [] }}"
        - if:
            - "{{ not host }}"
          then:
            - stop: >-
                Recordings are not configured: set registrazioni: true on the
                decoder with the hard disk (sky_epg_decoders.yaml)
              error: true
        - if:
            - "{{ azione not in ['registra', 'registra_serie', 'annulla', 'annulla_serie'] }}"
          then:
            - stop: Invalid action
              error: true
        - if:
            - "{{ azione in ['registra', 'registra_serie'] and not id_evento }}"
          then:
            - stop: Missing event id (eid)
              error: true
        - if:
            - "{{ azione in ['annulla', 'annulla_serie'] and not id_reg }}"
          then:
            - stop: Missing recording id (pvrid)
              error: true
        - variables:
            percorso: >-
              {{ {'registra': 'pvr/action/bookrecording?eid=' ~ id_evento,
                  'registra_serie': 'pvr/action/bookseriesrecording?eid=' ~ id_evento,
                  'annulla': 'pvr/action/delete?pvrid=' ~ id_reg,
                  'annulla_serie': 'pvr/action/seriesunlink?pvrid=' ~ id_reg}[azione] }}
            risposta: {}
        - action: rest_command.sky_epg_decoder_azione
          data:
            host: "{{ host }}"
            percorso: "{{ percorso }}"
          response_variable: risposta
          continue_on_error: true
        - if:
            - "{{ (risposta.status | default(0)) != 200 }}"
          then:
            - event: sky_epg_aggiorna_registrazioni
            - stop: The Sky Q decoder did not accept the operation
              error: true
        # Cancel series: besides unlinking the series, delete all the episodes of
        # the same series that are already scheduled.
        - if:
            - "{{ azione == 'annulla_serie' }}"
          then:
            - variables:
                id_serie: "{{ (programmate | selectattr('0', 'eq', id_reg) | map(attribute='8') | first) | default('', true) }}"
                da_cancellare: >-
                  {{ (programmate | selectattr('8', 'eq', id_serie) | selectattr('7', 'eq', 'SCHEDULED')
                      | map(attribute='0') | list) if id_serie else [id_reg] }}
            - repeat:
                for_each: "{{ da_cancellare if id_reg in da_cancellare else da_cancellare + [id_reg] }}"
                sequence:
                  - action: rest_command.sky_epg_decoder_azione
                    data:
                      host: "{{ host }}"
                      percorso: "pvr/action/delete?pvrid={{ repeat.item }}"
                    continue_on_error: true
        - delay:
            seconds: 1
        - event: sky_epg_aggiorna_registrazioni

  template:
    # Scheduled / in-progress recordings on the decoder with the hard disk.
    # Not updated while no decoder has "registrazioni: true".
    - triggers:
        - trigger: homeassistant
          event: start
        - trigger: time_pattern
          minutes: "/10"
        - trigger: event
          event_type: sky_epg_aggiorna_registrazioni
        - trigger: event
          event_type: sky_epg_aggiorna_canali
      conditions:
        - >-
          {% from 'sky_epg.jinja' import sky_epg_host_registrazioni %}
          {{ sky_epg_host_registrazioni() | length > 0 }}
      actions:
        - variables:
            host: >-
              {% from 'sky_epg.jinja' import sky_epg_host_registrazioni %}
              {{ sky_epg_host_registrazioni() }}
            risposta: {}
            spazio: {}
        - action: rest_command.sky_epg_decoder_leggi
          data:
            host: "{{ host }}"
            percorso: "pvr/?limit=1000&offset=0"
          response_variable: risposta
          continue_on_error: true
        - action: rest_command.sky_epg_decoder_leggi
          data:
            host: "{{ host }}"
            percorso: pvr/storage
          response_variable: spazio
          continue_on_error: true
        - variables:
            valida: >-
              {% from 'sky_epg.jinja' import sky_epg_pvr_valida %}
              {{ sky_epg_pvr_valida(risposta) == 'si' }}
            programmate: >-
              {% from 'sky_epg.jinja' import sky_epg_programmate %}
              {{ sky_epg_programmate(risposta) }}
            disco: >-
              {% set c = spazio.content if spazio is mapping and (spazio.status | default(0)) == 200 else none %}
              {{ ((100 * c.userQuotaUsed / c.userQuotaMax) | round(1)) if c is mapping and (c.userQuotaMax | default(0)) > 0 else none }}
      sensor:
        - name: Sky Q registrazioni
          unique_id: sky_epg_registrazioni
          icon: mdi:record-rec
          unit_of_measurement: programmate
          state: "{{ (programmate | count) if valida else (this.state | int(0)) }}"
          attributes:
            host: "{{ host }}"
            raggiungibile: "{{ valida }}"
            disco_occupato: "{{ disco if disco is not none else this.attributes.disco_occupato | default(none) }}"
            aggiornato: "{{ now().isoformat() if valida else this.attributes.aggiornato | default(none) }}"
            programmate: "{{ programmate if valida else this.attributes.programmate | default([]) }}"
