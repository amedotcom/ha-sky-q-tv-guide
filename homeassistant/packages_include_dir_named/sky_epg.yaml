# -----------------------------------------------------------------------------
# VARIANT FOR configuration.yaml WITH   packages: !include_dir_named packages
#
# With !include_dir_named the package name is the file name, so this file has
# no "sky_epg:" first line and everything is two spaces to the left.
# Otherwise it is identical to the file with the same name in
# homeassistant/packages/, the version for
#   packages: !include_dir_merge_named packages/
#
# Repository maintainers: this file is generated by
# tools/make_include_dir_named.py, edit the original instead.
# -----------------------------------------------------------------------------
# =============================================================================
# Sky Q TV Guide for Home Assistant - core package
# https://github.com/amedeorutigliano/ha-sky-q-tv-guide
#
# DO NOT EDIT THIS FILE: your decoders are configured in sky_epg_decoders.yaml.
#
# What this package provides:
# - rest_command.sky_epg_lista_canali  : reads the channel list from a Sky Q
#                                        decoder (http://<decoder>:9006/as/services)
# - rest_command.sky_epg_palinsesto    : reads the schedule of one channel for one
#                                        day from the Sky EPG service
#                                        (atlantis.epgsky.com, the same service the
#                                        decoders and the Sky Q integration use)
# - script.sky_epg_scarica_guida       : downloads the next N hours of schedule
#                                        for a slice of the channels
# - script.sky_epg_descrizione         : full description of one programme
#                                        (the guide keeps 100 characters)
# - sensor.sky_epg_guida_tv_1..8      : the 24-hour guide, split in 8 slices that
#                                        are downloaded in parallel every hour
# - script.sky_q_sintonizza_canale     : tunes a decoder to a channel number
# - script.sky_q_aggiorna_lista_canali : re-reads channel lists and guide now
#
# The channel list sensors (one per decoder) live in sky_epg_decoders.yaml.
# Shared template logic lives in custom_templates/sky_epg.jinja.
# The dashboard card is sky-epg-card (dist/sky-epg-card.js in the repository).
#
# Glossary (identifiers are Italian): canali = channels, guida/palinsesto =
# guide/schedule, sintonizza = tune, aggiorna = refresh, registrazioni =
# recordings, decoder = set-top box.
# =============================================================================
rest_command:
  # Channel list of a decoder: {"services": [{"c": "101", "t": "Rai 1 HD",
  # "sid": "899", "servicetype": "DSAT", "sf": "hd", ...}, ...]}
  sky_epg_lista_canali:
    url: "http://{{ host }}:9006/as/services"
    method: get
    timeout: 30

  # Schedule of ONE channel (sid) for ONE day (giorno = YYYYMMDD).
  # The service rejects requests for several channels at once.
  sky_epg_palinsesto:
    url: "http://atlantis.epgsky.com/as/schedule/{{ giorno }}/{{ sid }}"
    method: get
    headers:
      x-skyott-territory: IT
      x-skyott-provider: SKY
      x-skyott-proposition: SKYQ
    timeout: 30

# The channel list (~1,100 entries) and the guide exceed the 16 KB attribute
# limit of the recorder: they are not useful in the history anyway.
# (A Home Assistant restart is needed for recorder changes.)
recorder:
  exclude:
    entity_globs:
      - sensor.sky_q_*_canali
      - sensor.sky_epg_*

script:
  # Downloads from the Sky EPG service the next "ore" hours of schedule of the
  # Sky channels whose sid satisfies sid % parti == parte, and returns them as
  # the script response:
  #   { guida: { sid: [[start epoch, duration s, title, description, eid, flags], ...] }, ore: N }
  # One request per channel and per day (multi-channel requests are rejected).
  sky_epg_scarica_guida:
    alias: Sky EPG - scarica palinsesto
    description: >-
      Downloads part of the Sky TV guide. Used by the sensors
      sensor.sky_epg_guida_tv_1..8 (packages/sky_epg.yaml).
    icon: mdi:television-guide
    mode: parallel
    max: 20
    trace:
      stored_traces: 1
    fields:
      parte:
        description: Slice of the channels to download (0 .. parti-1)
        default: 0
        selector:
          number: { min: 0, max: 31, mode: box }
      parti:
        description: Number of slices the channels are split into
        default: 8
        selector:
          number: { min: 1, max: 32, mode: box }
      ore:
        description: Hours of schedule to download
        default: 24
        selector:
          number: { min: 1, max: 48, mode: box }
    sequence:
      - variables:
          n_ore: "{{ ore | default(24) | int(24) }}"
          n_parti: "{{ [parti | default(8) | int(8), 1] | max }}"
          n_parte: "{{ parte | default(0) | int(0) }}"
          inizio: "{{ now().timestamp() | int }}"
          # +1 hour of margin: the sensors are refreshed every hour
          fine: "{{ (now() + timedelta(hours=n_ore + 1)).timestamp() | int }}"
          # the file of one day covers until about 04:00 of the next day
          giorni: >
            {{ [now().strftime('%Y%m%d')]
               + ([(now() + timedelta(days=1)).strftime('%Y%m%d')] if now().hour + n_ore + 1 >= 27 else [])
               + ([(now() + timedelta(days=2)).strftime('%Y%m%d')] if now().hour + n_ore + 1 >= 51 else []) }}
          tutti: >
            {% from 'sky_epg.jinja' import sky_epg_sids %}
            {{ sky_epg_sids() }}
          sids: >
            {% set ns = namespace(l=[]) %}
            {% for s in tutti if (s | int(0)) % n_parti == n_parte %}
            {% set ns.l = ns.l + [s | string] %}
            {% endfor %}
            {{ ns.l }}
          guida: {}
      - repeat:
          for_each: "{{ sids }}"
          sequence:
            - variables:
                sid: "{{ repeat.item }}"
                eventi: []
            - repeat:
                for_each: "{{ giorni }}"
                sequence:
                  - variables:
                      risposta: {}
                  - action: rest_command.sky_epg_palinsesto
                    data:
                      giorno: "{{ repeat.item }}"
                      sid: "{{ sid }}"
                    response_variable: risposta
                    continue_on_error: true
                  - variables:
                      eventi: >
                        {% from 'sky_epg.jinja' import sky_epg_eventi %}
                        {{ sky_epg_eventi(risposta, eventi, inizio, fine) }}
            - variables:
                guida: "{{ dict(guida, **{(sid | string): eventi}) if eventi else guida }}"
      - variables:
          risultato: "{{ {'guida': guida, 'ore': n_ore} }}"
      - stop: Palinsesto scaricato
        response_variable: risultato

  # Full description of ONE programme, returned as the script response:
  #   { descrizione: "..." }   (empty if the programme is not found)
  # The guide sensors keep only the first 100 characters of each description;
  # the card calls this script when the menu of a programme is opened. Sky itself
  # sends at most about 230 characters.
  sky_epg_descrizione:
    alias: Sky EPG - descrizione programma
    description: >-
      Returns the full description of one programme from the Sky EPG service. Used by
      sky-epg-card when the menu of a programme is opened (the guide sensors keep only
      the first 100 characters).
    icon: mdi:text-box-outline
    mode: parallel
    max: 10
    trace:
      stored_traces: 1
    fields:
      sid:
        description: Sky channel id (sid) of the guide
        required: true
        example: "899"
        selector:
          text:
            multiline: false
      eid:
        description: Sky event id of the programme
        example: E383-116
        selector:
          text:
            multiline: false
      inizio:
        description: Start of the programme (epoch seconds)
        required: true
        example: 1790942700
        selector:
          number: { min: 0, max: 9999999999, mode: box }
    sequence:
      - variables:
          t0: "{{ inizio | int(0) }}"
          id_evento: "{{ eid | default('') | string | trim }}"
          # the file of one day covers from the early morning until about 04:00 of
          # the next day: look in the file of the start day, then in the day before
          giorni: >
            {{ [t0 | timestamp_custom('%Y%m%d'), (t0 - 86400) | timestamp_custom('%Y%m%d')] }}
          descrizione: ""
      - repeat:
          for_each: "{{ giorni }}"
          sequence:
            - condition: template
              value_template: "{{ not descrizione }}"
            - variables:
                risposta: {}
            - action: rest_command.sky_epg_palinsesto
              data:
                giorno: "{{ repeat.item }}"
                sid: "{{ sid | string | trim }}"
              response_variable: risposta
              continue_on_error: true
            - variables:
                descrizione: >
                  {% from 'sky_epg.jinja' import sky_epg_descrizione %}
                  {{ sky_epg_descrizione(risposta, id_evento, t0) }}
      - variables:
          risultato: "{{ {'descrizione': descrizione | string | trim} }}"
      - stop: Descrizione letta
        response_variable: risultato

  # Tunes a decoder to a channel number. Used by the card (tap on a channel).
  sky_q_sintonizza_canale:
    alias: Sky Q - Sintonizza canale
    description: >-
      Tunes a Sky Q decoder to a channel number (used by sky-epg-card). If the
      decoder is in standby it is turned on first. Sends "backup" followed by the
      channel digits (like the "Enter buttons" of the Sky Q integration), then
      polls the decoder until it reports the new channel.
    icon: mdi:television-guide
    mode: parallel
    max: 10
    fields:
      decoder:
        name: Decoder
        description: Sky Q media player to tune
        required: true
        selector:
          entity:
            filter:
              - domain: media_player
                integration: skyq
      canale:
        name: Canale
        description: Channel number (e.g. 101, 5001)
        required: true
        example: "101"
        selector:
          text:
            multiline: false
    sequence:
      - variables:
          numero: "{{ canale | string | trim }}"
          tasti: "{{ 'backup,' ~ ((canale | string | trim) | list | join(',')) }}"
      - if:
          - condition: template
            value_template: "{{ not (numero | regex_match('^[0-9]{1,4}$')) }}"
        then:
          - stop: Invalid channel number
            error: true
      - if:
          - condition: template
            value_template: "{{ states(decoder) in ['off', 'standby'] }}"
        then:
          - action: media_player.turn_on
            target:
              entity_id: "{{ decoder }}"
          - delay:
              seconds: 4
      - action: media_player.play_media
        target:
          entity_id: "{{ decoder }}"
        data:
          media_content_type: skyq
          media_content_id: "{{ tasti }}"
      # The Sky Q integration polls the decoder every 10 s: poll it every 1.5 s
      # until it reports the new channel (at most 6 times), so the dashboard
      # highlights the new channel right away.
      - alias: Refresh the current channel now
        repeat:
          sequence:
            - delay:
                milliseconds: 1500
            - action: homeassistant.update_entity
              target:
                entity_id: "{{ decoder }}"
              continue_on_error: true
          until:
            - "{{ (state_attr(decoder, 'skyq_channelno') | string | int(0)) == (numero | int(0)) or repeat.index >= 6 }}"

  # Re-reads the channel lists of all decoders and the Sky guide right away.
  # Used by the refresh button of the card.
  sky_q_aggiorna_lista_canali:
    alias: Sky Q - Aggiorna lista canali
    description: >-
      Re-reads the channel list of every Sky Q decoder and the Sky TV guide now
      (fires the sky_epg_aggiorna_canali event).
    icon: mdi:refresh
    mode: single
    sequence:
      - event: sky_epg_aggiorna_canali

template:
  # ------------- TV guide: Sky schedule of the next 24 hours -------------
  # 8 sensors (sensor.sky_epg_guida_tv_1..8) working in parallel: each one asks
  # script.sky_epg_scarica_guida for the schedule of 1/8 of the channels
  # (sid % 8). Attribute "guida" = { sid: [[start, duration, title, description, eid, flags], ...] }
  # The card merges the guides of all the sensors automatically.
  # Refreshed at HA start, every hour (minute 2) and on demand.
  - triggers: &sky_epg_guida_triggers
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "2"
      - trigger: event
        event_type: sky_epg_aggiorna_canali
    actions:
      - variables:
          r: {}
      - action: script.sky_epg_scarica_guida
        data: { parte: 0, parti: 8, ore: 24 }
        response_variable: r
        continue_on_error: true
    sensor:
      - name: Sky EPG guida TV 1
        unique_id: sky_epg_guida_tv_1
        <<: &sky_epg_guida_sensore
          icon: mdi:television-guide
          unit_of_measurement: canali
          state: "{{ (r.guida | count) if r.guida is defined and r.guida else (this.state | int(0)) }}"
          attributes:
            ore: "{{ r.ore if r.ore is defined else this.attributes.ore | default(24) }}"
            aggiornato: "{{ now().isoformat() if r.guida is defined and r.guida else this.attributes.aggiornato | default(none) }}"
            guida: "{{ r.guida if r.guida is defined and r.guida else this.attributes.guida | default({}) }}"

  - triggers: *sky_epg_guida_triggers
    actions:
      - variables:
          r: {}
      - action: script.sky_epg_scarica_guida
        data: { parte: 1, parti: 8, ore: 24 }
        response_variable: r
        continue_on_error: true
    sensor:
      - name: Sky EPG guida TV 2
        unique_id: sky_epg_guida_tv_2
        <<: *sky_epg_guida_sensore

  - triggers: *sky_epg_guida_triggers
    actions:
      - variables:
          r: {}
      - action: script.sky_epg_scarica_guida
        data: { parte: 2, parti: 8, ore: 24 }
        response_variable: r
        continue_on_error: true
    sensor:
      - name: Sky EPG guida TV 3
        unique_id: sky_epg_guida_tv_3
        <<: *sky_epg_guida_sensore

  - triggers: *sky_epg_guida_triggers
    actions:
      - variables:
          r: {}
      - action: script.sky_epg_scarica_guida
        data: { parte: 3, parti: 8, ore: 24 }
        response_variable: r
        continue_on_error: true
    sensor:
      - name: Sky EPG guida TV 4
        unique_id: sky_epg_guida_tv_4
        <<: *sky_epg_guida_sensore

  - triggers: *sky_epg_guida_triggers
    actions:
      - variables:
          r: {}
      - action: script.sky_epg_scarica_guida
        data: { parte: 4, parti: 8, ore: 24 }
        response_variable: r
        continue_on_error: true
    sensor:
      - name: Sky EPG guida TV 5
        unique_id: sky_epg_guida_tv_5
        <<: *sky_epg_guida_sensore

  - triggers: *sky_epg_guida_triggers
    actions:
      - variables:
          r: {}
      - action: script.sky_epg_scarica_guida
        data: { parte: 5, parti: 8, ore: 24 }
        response_variable: r
        continue_on_error: true
    sensor:
      - name: Sky EPG guida TV 6
        unique_id: sky_epg_guida_tv_6
        <<: *sky_epg_guida_sensore

  - triggers: *sky_epg_guida_triggers
    actions:
      - variables:
          r: {}
      - action: script.sky_epg_scarica_guida
        data: { parte: 6, parti: 8, ore: 24 }
        response_variable: r
        continue_on_error: true
    sensor:
      - name: Sky EPG guida TV 7
        unique_id: sky_epg_guida_tv_7
        <<: *sky_epg_guida_sensore

  - triggers: *sky_epg_guida_triggers
    actions:
      - variables:
          r: {}
      - action: script.sky_epg_scarica_guida
        data: { parte: 7, parti: 8, ore: 24 }
        response_variable: r
        continue_on_error: true
    sensor:
      - name: Sky EPG guida TV 8
        unique_id: sky_epg_guida_tv_8
        <<: *sky_epg_guida_sensore
