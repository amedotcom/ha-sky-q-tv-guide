# Minimal configuration.yaml addition needed by Sky Q TV Guide.
#
# If your configuration.yaml already has a "packages:" line, keep it and copy the
# package files that match it:
#   packages: !include_dir_merge_named packages/  -> homeassistant/packages/
#   packages: !include_dir_named packages         -> homeassistant/packages_include_dir_named/
#
# Otherwise add these lines and use homeassistant/packages/ (each file starts with
# the name of its package: sky_epg:, sky_epg_decoders:, sky_epg_registrazioni:).
homeassistant:
  packages: !include_dir_merge_named packages/

# Optional: hide the "Cannot connect to host <ip>:9006" errors of a decoder that is
# often switched off at the mains (this hides ALL rest_command errors).
# logger:
#   logs:
#     homeassistant.components.rest_command: critical
